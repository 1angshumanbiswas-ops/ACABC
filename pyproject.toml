[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ind-acabc-architecture-ai"
version = "0.1.0"
description = "ACABC geo-financial decision-intelligence backend: one orchestrator, six agents, seven read-only MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.5",
  "uvicorn>=0.27",
  "pandas>=2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
pdf = ["reportlab>=4.0"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0", "mcp>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acabc = ["seed/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
